}

/* Content */

.card-name {

  color: var(--on-surface);

}
.card-shared {

.card-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn {

];
function rubroColor(r) {
  let h = 0; for (const c of r) h = (h*31 + c.charCodeAt(0)) & 0xFFFF;
  return COLORS[h % COLORS.length];
}
function initials(name) {
  const p = name.trim().split(/\s+/);
  return p.length >= 2 ? (p[0][0]+p[1][0]).toUpperCase() : name.slice(0,2).toUpperCase();

let activeRubro = "Todos", searchQ = "";
const rubros = ["Todos", ...new Set(DATA.map(p => p.rubro).sort())];

function renderFilters() {
  document.getElementById("filters").innerHTML = rubros.map(r =>
    `<button class="chip${r===activeRubro?' active':''}" onclick="setRubro(\`${r.replace(/`/g,'\\`')}\`)">${r}</button>`
  ).join("");
}
function setRubro(r) { activeRubro = r; renderFilters(); renderList(); }

let shareTimers = {};
async function share(i) {
  const p = DATA[i];
  const text = `${p.name}\n${p.rubro}\nTel: ${p.phone_display}\nwa.me/${waNum(p)}`;
  if (navigator.share) { try { await navigator.share({ text }); return; } catch(e) {} }
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.querySelector(`[data-share="${i}"]`);
    if (btn) {
      btn.innerHTML = '<span class="msr" style="color:var(--primary);font-size:22px">check_circle</span>';
      clearTimeout(shareTimers[i]);
      shareTimers[i] = setTimeout(() => { btn.innerHTML = '<span class="msr" style="font-size:22px">ios_share</span>'; }, 1800);
    }
  } catch(e) { alert(text); }
}

function renderList() {
  const q = searchQ.toLowerCase();
  const filtered = DATA.map((p,i) => ({...p,_i:i})).filter(p =>
    (activeRubro==="Todos" || p.rubro===activeRubro) &&
    (!q || p.name.toLowerCase().includes(q) || p.rubro.toLowerCase().includes(q))
  );
  document.getElementById("count").textContent =
    `${filtered.length} proveedor${filtered.length!==1?'es':''}`;
  if (!filtered.length) {
    document.getElementById("list").innerHTML='<div class="empty">Sin resultados</div>'; return;
  }
  document.getElementById("list").innerHTML = filtered.map(p => {
    const color = rubroColor(p.rubro);
    const shared = [p.shared_by, p.date].filter(Boolean).join(' · ');
    return `<div class="card">
      <div class="avatar" style="background:${color}">${initials(p.name)}</div>
      <div class="card-content">
        <div class="card-name">${p.name}</div>
        <div class="card-sub">
          <span class="rubro-chip">${p.rubro}</span>
          ${shared ? `<span class="card-shared">${shared}</span>` : ''}
        </div>
      </div>
      <div class="card-actions">
        <a class="icon-btn" href="https://wa.me/${waNum(p)}" target="_blank" rel="noopener" title="WhatsApp">${WA_SVG}</a>
        <button class="icon-btn share-btn" data-share="${p._i}" onclick="share(${p._i})" title="Compartir">
          <span class="msr" style="font-size:22px">ios_share</span>
        </button>
      </div>
    </div>`;
  }).join("");
}
