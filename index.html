<style>

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #9DD89F;

    --primary-container: #155329;
    --on-primary-container: #B7EFCE;
    --surface: #191C19;

  }
}
:root[data-theme="dark"] {
  --primary: #9DD89F;
  --on-primary: #00391C;
  --primary-container: #155329;
  --on-primary-container: #B7EFCE;

}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {

}

/* ── Top App Bar ── */
.app-bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;

  color: var(--on-primary);

.app-bar-title {

  padding: 0 16px; height: 52px;
}
.search-bar .msr { color: var(--on-surface-var); font-size: 22px; }
.search-input {

  color: var(--on-surface); outline: none;
}
.search-input::placeholder { color: var(--on-surface-var); }

/* ── Filter chips ── */
.chips-row {
  position: sticky;

  z-index: 10;
  background: var(--surface-container);
  border-bottom: 1px solid var(--outline-var);
  padding: 10px 16px;
  overflow-x: auto; white-space: nowrap;
  display: flex; gap: 8px;
  scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center;
  padding: 6px 16px; border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 500;
  border: 1px solid var(--outline-var);
  background: transparent; color: var(--on-surface-var);
  cursor: pointer; white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.chip.active {
  background: var(--primary-container);
  color: var(--on-primary-container);
  border-color: transparent; font-weight: 600;
}

/* ── List & cards ── */
.results-info {
  padding: 14px 16px 6px;
  font-size: 11px; font-weight: 600;
  color: var(--on-surface-var);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.list {
  padding: 4px 16px 80px;
  display: flex; flex-direction: column; gap: 8px;
}
.card {
  background: var(--surface-container-high);
  border-radius: 16px; padding: 14px 12px 14px 14px;
  display: flex; gap: 12px; align-items: flex-start;
  border: 1px solid transparent;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--outline-var); }

/* Avatar */
.avatar {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; flex-shrink: 0; color: #fff;
  letter-spacing: -0.01em;
}

/* Card body */
.card-body { flex: 1; min-width: 0; }
.card-name {
  font-size: 15px; font-weight: 600;
  color: var(--on-surface); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rubro-badge {
  display: inline-block;
  background: var(--primary-container);
  color: var(--on-primary-container);
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px; margin-top: 3px;
}
.card-context {
  font-size: 12px; color: var(--on-surface-var);
  line-height: 1.45; font-style: italic; margin-top: 7px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.card-shared {
  font-size: 11px; color: var(--outline); margin-top: 5px;
}

/* Action buttons */
.card-actions {
  display: flex; flex-direction: column; gap: 7px; flex-shrink: 0;
}
.action-btn {
  width: 40px; height: 40px; border-radius: 12px;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s; text-decoration: none;
}
.action-btn:active { opacity: 0.7; }
.btn-wa { background: var(--wa); }
.btn-share {
  background: var(--surface-container);
  border: 1px solid var(--outline-var);
  color: var(--on-surface-var);
}
.btn-share .msr { font-size: 18px; }
.wa-icon { width: 21px; height: 21px; fill: #fff; flex-shrink: 0; }

.empty { text-align: center; padding: 60px 16px; color: var(--on-surface-var); font-size: 15px; }
</style>

const AVATAR_COLORS = [
  '#2E7D32','#1565C0','#6A1B9A','#AD1457','#E65100',
  '#00695C','#4527A0','#283593','#558B2F','#4E342E',
  '#00838F','#F57F17','#37474F','#BF360C','#1A237E'
];

function rubroColor(rubro) {
  let h = 0;
  for (const c of rubro) h = (h * 31 + c.charCodeAt(0)) & 0xFFFF;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

function waNum(p) { return p.phone.replace(/[^\d]/g, ""); }

async function share(i) {
  const p = DATA[i];
  const text = `${p.name}\n${p.rubro}\nTel: ${p.phone_display}\nwa.me/${waNum(p)}`;
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch(e) {}
  }
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.querySelectorAll('.btn-share')[i];
    if (btn) { btn.innerHTML = '<span class="msr" style="font-size:16px;color:var(--primary)">check</span>'; setTimeout(() => btn.innerHTML = '<span class="msr">ios_share</span>', 1500); }
  } catch(e) { alert(text); }
}

let activeRubro = "Todos";
let searchQ = "";

const rubros = ["Todos", ...new Set(DATA.map(p => p.rubro).sort())];

function renderFilters() {
  document.getElementById("filters").innerHTML = rubros.map(r =>
    `<button class="chip${r === activeRubro ? ' active' : ''}" onclick="setRubro(\`${r.replace(/`/g,'\\`')}\`)">${r}</button>`
  ).join("");
}

function setRubro(r) { activeRubro = r; renderFilters(); renderList(); }

function renderList() {
  const q = searchQ.toLowerCase();
  const filtered = DATA.map((p, i) => ({...p, _i: i})).filter(p => {
    const matchR = activeRubro === "Todos" || p.rubro === activeRubro;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.rubro.toLowerCase().includes(q);
    return matchR && matchQ;
  });

  document.getElementById("count").textContent = `${filtered.length} proveedor${filtered.length !== 1 ? 'es' : ''}`;

  if (!filtered.length) {
    document.getElementById("list").innerHTML = '<div class="empty">Sin resultados</div>';
    return;
  }

  document.getElementById("list").innerHTML = filtered.map(p => {
    const color = rubroColor(p.rubro);
    const ini = initials(p.name);
    const sharedLine = p.shared_by ? `<div class="card-shared">Compartido por ${p.shared_by}${p.date ? ' · ' + p.date : ''}</div>` : '';
    const ctxLine = p.context ? `<div class="card-context">"${p.context}"</div>` : '';
    return `<div class="card">
      <div class="avatar" style="background:${color}">${ini}</div>
      <div class="card-body">
        <div class="card-name" title="${p.name}">${p.name}</div>
        <span class="rubro-badge">${p.rubro}</span>
        ${ctxLine}${sharedLine}
      </div>
      <div class="card-actions">
        <a class="action-btn btn-wa" href="https://wa.me/${waNum(p)}" target="_blank" rel="noopener" title="WhatsApp">${WA_SVG}</a>
        <button class="action-btn btn-share" onclick="share(${p._i})" title="Compartir"><span class="msr">ios_share</span></button>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("search").addEventListener("input", e => {
  searchQ = e.target.value; renderList();
});

renderFilters();
renderList();
</script>
